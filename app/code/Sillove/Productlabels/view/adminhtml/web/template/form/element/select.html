<div class="shape-section">
    <div id="shapes"></div>
</div>
<select class="admin__control-select myshapes" data-bind="
afterRender: initShapePickerCall,
    attr: {
        name: inputName,
        id: uid,
        disabled: disabled,
        'aria-describedby': noticeId

    hasFocus: focused,
    optgroup: options,
    value: value,
    optionsCaption: caption,
    optionsValue: 'value',
    optionsText: 'label'"
></select>
